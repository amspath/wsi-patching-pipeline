[build-system]
requires = ["hatchling>=1.25", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "wsi-patching"
dynamic = ["version"]
description = "A High Performance Patching Library for Digital Pathology AI dataset creation."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.14"
authors = [{ name = "Robin van Hoorn", email = "r.d.vanhoorn@amsterdamumc.nl" }]
keywords = ["digital pathology", "whole slide image", "WSI", "patching", "deep learning", "medical imaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "webdataset>=0.2.86",
    "pillow>=9.0",
    "fastslide==0.5.2",
    "orjson>=3.8",
    "opencv-python-headless>=4.8",
    "rtree>=1.0",
]

[project.urls]
Homepage = "https://github.com/amspath/wsi-patching-pipeline"
Repository = "https://github.com/amspath/wsi-patching-pipeline"

[project.optional-dependencies]
gpu = ['cupy-cuda12x; platform_system != "Darwin"', "torch", "torchvision"]
dev = ["ruff", "pytest", "tifffile", "pytest-benchmark", "ty", "mkdocs-material"]

# --- Hatch VCS versioning (default-ish behavior) ---
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.vcs]
# Strip the leading "v" from tags like "v0.2.0"
tag-pattern = "v(?P<base>.*)"
# Use the standard dev scheme: 0.2.0 on tag, 0.2.0.devN+gHASH ahead of tag
version-scheme = "guess-next-dev"
local-scheme = "node-and-date"
# (version-scheme/local-scheme here mirror the usual setuptools-scm defaults)

# --- Build config ---
[tool.hatch.build.targets.wheel]
packages = ["src/wsi_patching"]

[tool.hatch.build]
exclude = ["/data", "/output", ".vscode", ".git", "__pycache__"]

# --- Ruff ---
[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
docstring-code-format = false

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

# --- ty ---
[tool.ty.src]
exclude = ["examples"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = [
    "-ra",              # short test summary info
    "--strict-markers",
    "--strict-config",
    "--maxfail=1",
    "-q",
]
