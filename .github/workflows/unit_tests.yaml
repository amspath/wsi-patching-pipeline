name: CPU unit tests

on:
  push:
    branches: [main]
    paths: &unit_paths
      - src/wsi_patching/**
      - tests/unit/**
      - .github/workflows/unit_tests.yaml

  pull_request:
    branches: [main]
    paths: *unit_paths

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson( ((github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')) && '["3.10","3.11","3.12","3.13"]' || '["3.10","3.13"]' ) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project (dev extras)
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Install CPU torch for GPU-optional tests
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: pytest tests/unit
