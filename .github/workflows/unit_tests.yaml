name: Unit tests

on:
  push:
    branches: [ main ]
    paths: # Only test if relevant files changed
        - 'src/wsi_patching/**'    
        - 'tests/unit/**'
        - '.github/workflows/unit_tests.yaml'
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba (conda) with Python ${{ matrix.python-version }}
        uses: mamba-org/setup-micromamba@v1
        with:
            environment-name: test
            create-args: >-
              python=${{ matrix.python-version }}
            cache-environment: true
            condarc: |
              channels:
                - conda-forge
              channel_priority: strict

      - name: Show Python
        shell: bash -l {0}
        run: |
          which python
          python -V

      - name: Install project (dev extras)
        shell: bash -l {0}
        run: |
          conda install openslide
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        shell: bash -l {0}
        run: pytest -q
